<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./" />
    <title>Nokkhotro Lifestyle</title>
    <script>
      // GitHub Pages SPA redirect
      var l = window.location;
      // If deployed in a subdirectory, redirect back to root of applet
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') + '/'
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Nokkhotro Lifestyle...</p>
  </body>
</html>
